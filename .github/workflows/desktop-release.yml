# Builds the desktop app (Electron + node-llama-cpp) for Windows and Linux on GitHub's
# free public-repo runners and attaches the installers to a GitHub Release. The website's
# download links point at releases/latest/download/<stable-name> — cutting a new release
# updates every link automatically.
#
# Channels:
#   - GitHub Releases: NSIS + portable .exe (Windows), AppImage + .deb (Linux) — this workflow.
#   - Microsoft Store: AppX built locally / on a Windows machine with Partner Center identity
#     (`npm run electron:build:win:store`) — see docs/MICROSOFT_STORE.md. Not uploaded here
#     (publisher CN + identity must match Partner Center; store re-signs).
#   - macOS public product: native Swift App Store app only — docs/MAC_APP_STORE.md.
#     Electron mac is lab-only and never shipped from this workflow.
name: Desktop release (Windows + Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Test release provenance and failure gates
        run: node --test scripts/tests/desktop-release.test.mjs
      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the exact-source draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/desktop_release.mjs prepare

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            unpacked: win-unpacked
            platform: windows
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
            unpacked: linux-unpacked
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (root + ui via postinstall)
        run: npm ci
      # Gate the release on the same checks CI runs — a tagged build must not ship code that
      # fails typecheck/lint/tests (Q-144). Runs once on the Linux leg only (identical result
      # on both, and it keeps the Windows packaging leg fast).
      - name: Typecheck, lint, and test
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build backend + dashboard UI
        run: npm run build
      - name: Prepare and compile the pinned Prism desktop runtime
        run: |
          python scripts/prepare_prism_node_runtime.py prepare --package-dir node_modules/node-llama-cpp
          node node_modules/node-llama-cpp/dist/cli/cli.js source build --gpu false --ciMode --noUsageExample
          python scripts/prepare_prism_node_runtime.py verify --package-dir node_modules/node-llama-cpp
          node scripts/verify_prism_node_runtime.mjs
      - name: Build and seal the pinned isolated image runtime (no model weights)
        run: python scripts/build_desktop_diffusion.py build --work "${{ runner.temp }}/diffusion-desktop"
      - name: Build and seal the pinned vision worker (no model weights)
        run: python scripts/build_vision_runtime.py build --source node_modules/node-llama-cpp/llama/llama.cpp --work "${{ runner.temp }}/vision-desktop"
      - name: Verify the actual Prism and image DSOs coexist in both load orders (no weights)
        shell: bash
        run: |
          native_os="$(node -p "({win32:'win',linux:'linux'})[process.platform]")"
          python scripts/build_desktop_diffusion.py joint-load --directory "build/diffusion/$native_os-x64" --prism node_modules/node-llama-cpp/llama/localBuilds
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Probe the shipped Prism addon inside the packaged ASAR
        run: node scripts/verify_prism_desktop_package.mjs release/${{ matrix.unpacked }}/resources
      - name: Probe the shipped image CLI and verify its DSO, exports and dependency closure
        run: python scripts/build_desktop_diffusion.py verify --directory release/${{ matrix.unpacked }}/resources/diffusion --packaged
      - name: Probe the shipped vision worker and complete source identity
        run: python scripts/build_vision_runtime.py verify --directory release/${{ matrix.unpacked }}/resources/vision --packaged
      - name: Generate with the exact Bonsai model through the packaged addon
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 - <<'PY'
          import os
          import shutil
          required = 7 * 1024 ** 3
          available = shutil.disk_usage(os.environ["RUNNER_TEMP"]).free
          if available < required:
              raise SystemExit(f"Bonsai verification requires 7 GiB free; available: {available} bytes")
          PY
          curl --fail --location --retry 2 --max-time 600 \
            'https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/b072e1d3b35a0a630cece372c2127528e0994386/Ternary-Bonsai-2-27B-PTQ1_0.gguf?download=true' \
            --output "$RUNNER_TEMP/bonsai.gguf"
          echo "53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3  $RUNNER_TEMP/bonsai.gguf" | sha256sum --check
          node scripts/verify_prism_desktop_generation.mjs release/${{ matrix.unpacked }}/resources "$RUNNER_TEMP/bonsai.gguf"
      - name: Upload only this platform's installers to the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/desktop_release.mjs upload ${{ matrix.platform }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish only after both builds and all four installers are verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/desktop_release.mjs publish
