name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GitHub deprecated the Node-20 action runtime (2026-06-16). Opt every JS action into Node 24
# now — safer than bumping each action's major version blind, and clears the deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least-privilege GITHUB_TOKEN (audit MEDIUM): default to read-only for every job. A compromised
# action/dependency then can't push commits, open PRs, or mutate releases with the workflow token.
# Jobs that need more (e.g. codecov OIDC) opt in explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Run recommendation guardrail
        run: npm run check:recommendation

      - name: Run tests
        run: npm test

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: UI component + a11y tests (axe-core — r11 gate)
        run: cd ui && npm test

      - name: Golden chore suite (governed fs.* capabilities, no LLM)
        run: npm run test:golden-chores

      - name: Build
        run: npm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # codecov v4 tokenless upload (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4 — pinned to SHA (audit MEDIUM: third-party action)
        with:
          fail_ci_if_error: false

  # ── Mobile + cross-platform gates (audit C14/H11: these suites previously ran only
  #    locally, so they could regress silently). All three commands are the same ones
  #    documented in STATUS.md and verified locally. ──────────────────────────────────
  mobile-ios:
    name: iOS (QuenderinKit) tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run QuenderinKit tests
        working-directory: apple/QuenderinKit
        run: swift test

  prism-apple-core:
    name: Apple core (pinned Prism runtime)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified Prism source
        run: python3 scripts/prepare_prism_runtime.py fetch --destination "$RUNNER_TEMP/prism-llama"
      - name: Build the real host runtime
        run: |
          cmake -S "$RUNNER_TEMP/prism-llama" -B "$RUNNER_TEMP/prism-llama/build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_METAL=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build "$RUNNER_TEMP/prism-llama/build" --target llama --parallel 3
      - name: Compile and test the actual Swift adapter
        run: |
          QUENDERIN_RUNTIME=prism QUENDERIN_LLAMA_DIR="$RUNNER_TEMP/prism-llama" \
            swift test --package-path apple/QuenderinKit \
              -Xcc "-I$RUNNER_TEMP/prism-llama/include" \
              -Xcc "-I$RUNNER_TEMP/prism-llama/ggml/include"

  image-runtime:
    name: Local image runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    concurrency:
      group: image-runtime-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifests and no-weight image failure fixtures
        if: runner.os != 'Windows'
        env:
          QUENDERIN_DIFFUSION_TEST_SCRATCH: ${{ runner.temp }}
        run: |
          python3 scripts/prepare_diffusion_runtime.py check-manifests
          python3 scripts/test_diffusion_core.py
      - name: Build and verify the pinned desktop image CLI and private DSO
        if: runner.os != 'macOS'
        run: python scripts/build_desktop_diffusion.py build --work "${{ runner.temp }}/diffusion-desktop"
      - name: Run standalone Windows filesystem and Unicode fixtures (no weights)
        if: runner.os == 'Windows'
        run: |
          cmake -S native/diffusion/tests -B "$env:RUNNER_TEMP/diffusion-fixtures" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/diffusion-fixtures" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/diffusion-fixtures" -C Release --output-on-failure --timeout 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'scripts'); import build_desktop_diffusion as d; d.windows_tools(); print(d.runtime.verify_library(Path(os.environ['RUNNER_TEMP'])/'diffusion-fixtures/bin/quenderin_diffusion.dll','windows'))"
      - name: Build iOS and universal macOS image frameworks
        if: runner.os == 'macOS'
        run: bash apple/build-diffusion-xcframework.sh "$RUNNER_TEMP/diffusion-apple"
      - name: Compile and test the actual Swift image adapter
        if: runner.os == 'macOS'
        run: swift test --package-path apple/QuenderinKit --jobs 3
      - name: Compile the actual image UI against the iOS SDK (no signing or execution)
        if: runner.os == 'macOS'
        run: |
          brew install xcodegen
          cd apple/QuenderinApp
          xcodegen generate
          set -o pipefail
          xcodebuild -project Quenderin.xcodeproj -scheme Quenderin -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/image-ios-app" \
            CODE_SIGNING_ALLOWED=NO build | tail -60

  prism-inference:
    name: Bonsai pinned model (CPU load and generation)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified Prism source
        run: python3 scripts/prepare_prism_runtime.py fetch --destination "$RUNNER_TEMP/prism-llama"
      - name: Build the pinned CPU runtime
        id: compile-runtime
        run: |
          cmake -S "$RUNNER_TEMP/prism-llama" -B "$RUNNER_TEMP/prism-llama/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/prism-llama/build" --target llama-completion test-llama-archs test-chat-template --parallel 4
      - name: Exercise Jais dense and MoE graphs with tiny tensors
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: timeout 300 "$RUNNER_TEMP/prism-llama/build/bin/test-llama-archs" -a k2-horizon -s 1234
      - name: Exercise Nemotron hybrid graph with tiny tensors
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: timeout 300 "$RUNNER_TEMP/prism-llama/build/bin/test-llama-archs" -a nemotron_h_moe -s 1234
      - name: Exercise Beam graph with tiny tensors
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: timeout 300 "$RUNNER_TEMP/prism-llama/build/bin/test-llama-archs" -a beam -s 1234
      - name: Verify publisher prompt formatting
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: timeout 120 "$RUNNER_TEMP/prism-llama/build/bin/test-chat-template"
      - name: Exercise Muse with tiny generated tensors (no Muse weight download)
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: timeout 300 "$RUNNER_TEMP/prism-llama/build/bin/test-llama-archs" --arch muse-spark
      - name: Verify the native Muse text prompt
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror android/jni/tests/muse_chat_test.cpp -o "$RUNNER_TEMP/muse-chat-test"
          "$RUNNER_TEMP/muse-chat-test"
      - name: Fetch and verify the exact catalog artifact
        id: fetch-artifact
        if: ${{ !cancelled() && steps.compile-runtime.outcome == 'success' }}
        run: |
          curl --fail --location --retry 2 --max-time 600 \
            'https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/b072e1d3b35a0a630cece372c2127528e0994386/Ternary-Bonsai-2-27B-PTQ1_0.gguf?download=true' \
            --output "$RUNNER_TEMP/bonsai.gguf"
          echo "53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3  $RUNNER_TEMP/bonsai.gguf" | sha256sum --check
      - name: Load ternary weights and generate a bounded answer
        if: ${{ !cancelled() && steps.fetch-artifact.outcome == 'success' }}
        run: |
          timeout 1200 "$RUNNER_TEMP/prism-llama/build/bin/llama-completion" \
            -m "$RUNNER_TEMP/bonsai.gguf" -ngl 0 -c 512 -n 64 -t 4 \
            --no-conversation --no-display-prompt --temp 0 \
            -p $'<|im_start|>user\nReply with the single word hello.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n' \
            > "$RUNNER_TEMP/bonsai-answer.log"
          cat "$RUNNER_TEMP/bonsai-answer.log"
          grep -qi hello "$RUNNER_TEMP/bonsai-answer.log"

  prism-desktop:
    name: Desktop native runtimes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: desktop-native-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            unpacked: linux-unpacked
          - os: windows-latest
            target: --win
            unpacked: win-unpacked
          - os: macos-15
            target: --mac
            unpacked: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare verified Prism source and versioned addon patch
        run: python scripts/prepare_prism_node_runtime.py prepare --package-dir node_modules/node-llama-cpp
      - name: Compile the actual desktop addon (bounded CPU backend)
        run: node node_modules/node-llama-cpp/dist/cli/cli.js source build --gpu false --ciMode --noUsageExample
      - name: Verify source and probe the built addon
        run: |
          python scripts/prepare_prism_node_runtime.py verify --package-dir node_modules/node-llama-cpp
          node scripts/verify_prism_node_runtime.mjs
      - name: Build and seal the isolated desktop image runtime
        run: python scripts/build_desktop_diffusion.py build --work "${{ runner.temp }}/diffusion-desktop"
      - name: Load the actual Prism and image DSOs together in both orders (no weights)
        shell: bash
        run: |
          native_arch="$(node -p process.arch)"
          native_os="$(node -p "({win32:'win',darwin:'mac',linux:'linux'})[process.platform]")"
          python scripts/build_desktop_diffusion.py joint-load --directory "build/diffusion/$native_os-$native_arch" --prism node_modules/node-llama-cpp/llama/localBuilds
      - name: Build and package the desktop application
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          native_arch="$(node -p process.arch)"
          npx --no-install electron-builder --dir ${{ matrix.target }} --"$native_arch" --publish never
      - name: Probe the addon inside the actual packaged ASAR
        if: runner.os != 'macOS'
        run: node scripts/verify_prism_desktop_package.mjs release/${{ matrix.unpacked }}/resources
      - name: Verify the packaged image CLI, private DSO, exports and dependency closure
        if: runner.os != 'macOS'
        run: python scripts/build_desktop_diffusion.py verify --directory release/${{ matrix.unpacked }}/resources/diffusion --packaged
      - name: Verify the macOS lab application's packaged image runtime
        if: runner.os == 'macOS'
        run: |
          resources="$(find release -maxdepth 3 -type d -name Quenderin.app -print -quit)/Contents/Resources"
          python3 scripts/build_desktop_diffusion.py verify --directory "$resources/diffusion" --packaged

  # ── The APP target is a separate compile gate: `swift test` runs on the macOS SDK and never
  #    compiles the `canImport(UIKit)` branches or iOS-SDK-only actor isolation. 2026-09-05: main was
  #    green while the Quenderin app failed to build under Xcode 16.2 / Swift 6 (UIDevice @MainActor,
  #    @Sendable onPreferenceChange). Mock engine here (no xcframework in CI) — the point is compiling.
  mobile-ios-app:
    name: iOS app target builds (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: apple/QuenderinApp
        run: xcodegen generate
      - name: Build the Quenderin app for the iOS Simulator
        working-directory: apple/QuenderinApp
        run: |
          set -o pipefail
          xcodebuild -project Quenderin.xcodeproj -scheme Quenderin -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  mobile-android-core:
    name: Android core (Kotlin) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler
        run: |
          curl -sSLO https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          # Verify the download before trusting it (audit MEDIUM: a network-fetched toolchain ran
          # unverified). Pinned sha256 of the official v2.0.21 release asset; fail closed on mismatch.
          echo "0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  kotlin-compiler-2.0.21.zip" | sha256sum -c -
          unzip -q kotlin-compiler-2.0.21.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile + run the pure-Kotlin core verification
        run: |
          kotlinc android/quenderin-core/src/main/kotlin/ai/quenderin/core/*.kt \
            android/quenderin-core/src/verify/CoreVerify.kt -include-runtime -d /tmp/qcore.jar
          java -jar /tmp/qcore.jar
      - name: Verify multipart installation and Muse response framing with small fixtures
        run: |
          kotlinc android/quenderin-core/src/main/kotlin/ai/quenderin/core/*.kt \
            android/quenderin-core/src/test/kotlin/ai/quenderin/core/ModelArtifactChecks.kt \
            android/quenderin-core/src/verify/ModelArtifactsVerify.kt -include-runtime -d "$RUNNER_TEMP/model-artifacts.jar"
          java -jar "$RUNNER_TEMP/model-artifacts.jar"
      - name: Verify image component installation, resources and unavailable native failure
        run: |
          kotlinc android/quenderin-core/src/main/kotlin/ai/quenderin/core/*.kt \
            android/quenderin-core/src/verify/ImageGenerationVerify.kt -include-runtime -d "$RUNNER_TEMP/image-generation.jar"
          java -Djava.io.tmpdir="$RUNNER_TEMP" -jar "$RUNNER_TEMP/image-generation.jar"
      - name: Verify native discovery snapshot and Android offline catalog
        run: |
          python3 scripts/generate_website_catalog.py --check
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/org-json.jar
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/org-json.jar" | sha256sum -c -
          kotlinc android/quenderin-core/src/main/kotlin/ai/quenderin/core/*.kt \
            android/app/src/main/kotlin/ai/quenderin/app/ModelReleaseJSON.kt \
            android/quenderin-core/src/verify/ModelReleasesVerify.kt \
            -classpath /tmp/org-json.jar -include-runtime -d /tmp/model-releases.jar
          java -cp /tmp/model-releases.jar:/tmp/org-json.jar ai.quenderin.core.ModelReleasesVerifyKt website/data/model-releases.json

  mobile-android-app:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Builds the real :app module — Compose UI + AndroidManifest merge. The kotlinc-core job
    # above cannot catch app-module breakage (missing imports, bad @Composable, manifest errors);
    # only a full Gradle build does (see BUG_JOURNAL.md, 2026-06-15). Verified locally on JDK 21.
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3 — pinned to SHA (audit MEDIUM: third-party action)
        with:
          # This pinned action defaults to the retired `tools` package. Request only
          # packages used by this app so SDK setup can reach the compile gate.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Prepare verified Prism source
        run: python3 scripts/prepare_prism_runtime.py fetch --destination "$RUNNER_TEMP/prism-llama"
      - name: Build the isolated image runtime and JNI bridge
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264" bash scripts/build_android_diffusion.sh "$RUNNER_TEMP/android-diffusion"
      - name: Build the debug APK and release bundle with the actual Prism JNI runtime
        working-directory: android
        # The bundle is unsigned without the existing upload key. Compilation is
        # a release check, not evidence of signing or Play submission.
        run: ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --console=plain -Pquenderin.runtime=prism -Pquenderin.llamaDir="$RUNNER_TEMP/prism-llama" -Pquenderin.diffusionLibDir="$RUNNER_TEMP/android-diffusion/jniLibs"
      - name: Verify both packaged image DSO pairs, dependency closure and 16 KiB alignment
        run: |
          python3 scripts/verify_diffusion_android_package.py --libraries "$RUNNER_TEMP/android-diffusion/jniLibs" --package android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_diffusion_android_package.py --libraries "$RUNNER_TEMP/android-diffusion/jniLibs" --package android/app/build/outputs/bundle/release/app-release.aab
      - name: Run native runtime and memory guard unit tests
        working-directory: android
        run: ./gradlew :quenderin-core:test --no-daemon --console=plain

  mobile-android-jni:
    name: Android JNI (C++ syntax-check)
    runs-on: ubuntu-latest
    # Q-592: nothing else in CI compiles the JNI bridge (android/jni/llama_jni.cpp) — the app build
    # skips it (no jni/llama.cpp checked in), so an NDK/native regression could ship undetected. This
    # syntax-checks it with the pre-installed NDK clang against real llama.cpp headers (HEAD of
    # ggml-org/llama.cpp — the same ref android/verify-llama-link.sh clones for the on-device build).
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp headers (shallow, matches verify-llama-link.sh)
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
      - name: Syntax-check the JNI bridge
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDK_CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
          LLAMA_INCLUDE=/tmp/llama.cpp/include \
          GGML_INCLUDE=/tmp/llama.cpp/ggml/include \
            bash scripts/check-jni-syntax.sh

  catalog-parity:
    name: Model catalog parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Manifest is regenerated from the desktop catalog (no drift)
        run: |
          python3 scripts/export_catalog.py
          git diff --exit-code shared/model-catalog.json
      - name: All three platform catalogs agree (ids, params, quant, sha256)
        run: |
          python3 scripts/check_catalog_parity.py
          python3 scripts/generate_muse_artifacts.py --check
          python3 -m unittest discover -s scripts/tests -p test_catalog_parity.py
      - name: Prism source provenance and preservation gates
        run: |
          python3 -m unittest discover -s scripts/tests -p test_prism_runtime.py
          python3 -m unittest discover -s scripts/tests -p test_prism_node_runtime.py
          python3 -m unittest discover -s scripts/tests -p test_prism_apple_runtime.py
          python3 -m unittest discover -s scripts/tests -p test_diffusion_android_package.py
          python3 -m unittest discover -s scripts/tests -p test_diffusion_apple_runtime.py
          python3 -m unittest discover -s scripts/tests -p test_desktop_diffusion.py
          python3 -m unittest discover -s scripts/tests -p test_experimental_model_support.py
          python3 native/diffusion/tests/test_windows_exports.py
          node --test scripts/tests/prism-node-loader.test.mjs scripts/tests/desktop-release.test.mjs
          node --test scripts/tests/desktop-diffusion-pack.test.cjs
      - name: FEATURES.md model table is a rendering of the catalog (no doc drift)
        run: python3 scripts/generate_features_models.py --check
      - name: Website tables and calculator match the app catalog
        run: python3 scripts/generate_website_catalog.py --check
      - name: Model discovery, freshness and fallback tests
        run: node --test scripts/tests/model-releases.test.mjs
      - name: Agent-logic parity suites cover the same vectors (iOS + Android + Desktop)
        run: python3 scripts/check_agent_parity.py
      - name: Model-router parity suites cover the same vectors (iOS + Android)
        run: python3 scripts/check_router_parity.py
      - name: Safety blocklist is one list across iOS + Android + Desktop
        run: python3 scripts/check_safety_parity.py
      - name: Sampling recipes match shared/sampling-profiles.json (Swift/Kotlin/JNI)
        run: python3 scripts/check_sampling_parity.py
      - name: Golden chat UX contracts (starters, tiers, vision refusal)
        run: python3 scripts/check_golden_chat_prompts.py
