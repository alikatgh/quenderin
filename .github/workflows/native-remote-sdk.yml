name: Native remote SDK and app linking

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/remote-crypto/**'
      - 'native/max-runtime/**'
      - 'apple/QuenderinKit/**'
      - 'apple/QuenderinApp/Sources/**'
      - 'apple/QuenderinApp/project.yml'
      - 'android/**'
      - '.github/workflows/native-remote-sdk.yml'

permissions:
  contents: read

concurrency:
  group: native-remote-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: '0'
  CARGO_HTTP_TIMEOUT: '30'
  CARGO_BUILD_JOBS: '2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apple:
    # Public standard runners; compile only. No signing, archive, cloud activation,
    # simulator boot, uploaded artifact, cache, service, provider or app credential.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 40
    env:
      QUENDERIN_REQUIRE_REMOTE_CRYPTO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check pinned source and receipt failure tests
        run: |
          python3 -B native/remote-crypto/tools/verify_build_gate.py
          python3 -B -m unittest discover -s native/remote-crypto/tools -p 'test_*.py'
          python3 -B scripts/generate_inference_performance_identity.py --check
          python3 -B -m unittest scripts.tests.test_inference_performance_contract
          python3 -B -m unittest scripts.tests.test_remote_attention_contract
          python3 -B scripts/check_remote_attention_contract.py
      - name: Verify native Swift controller fixtures before the cross-target SDK build
        env:
          QUENDERIN_REQUIRE_REMOTE_CRYPTO: '0'
        run: |
          set -o pipefail
          swift test --package-path apple/QuenderinKit 2>&1 | tee "$RUNNER_TEMP/inference-performance-swift.log"
          python3 -B scripts/check_inference_performance.py --results "$RUNNER_TEMP/inference-performance-swift.log"
          python3 -B scripts/check_remote_attention_contract.py --results "$RUNNER_TEMP/inference-performance-swift.log"
      - name: Compile the portable MAX model-adapter boundary for iOS (no vendor runtime)
        run: |
          xcrun --sdk iphoneos clang -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I native/max-runtime/include native/max-runtime/src/quenderin_max_model.c
      - name: Select exact Rust compiler and supported Apple library targets
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Build actual generated Swift and static device/simulator/macOS SDK
        run: python3 -B native/remote-crypto/tools/native_sdk.py build --platform apple --sdk "$GITHUB_WORKSPACE/apple/QuenderinKit/build/RemoteCryptoSDK"
      - name: Obtain exact existing XcodeGen tool recipe
        working-directory: apple/QuenderinApp
        run: |
          test ! -e "$RUNNER_TEMP/remote-xcodegen"
          mkdir "$RUNNER_TEMP/remote-xcodegen"
          curl --fail --silent --show-error --location --proto '=https' --max-redirs 3 --connect-timeout 10 --max-time 120 --retry 0 --max-filesize 5000000 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip --output "$RUNNER_TEMP/remote-xcodegen/xcodegen.zip"
          python3 - "$RUNNER_TEMP/remote-xcodegen/xcodegen.zip" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          assert path.stat().st_size == 4319508 and hashlib.sha256(path.read_bytes()).hexdigest() == '090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef'
          PY
          unzip -q "$RUNNER_TEMP/remote-xcodegen/xcodegen.zip" -d "$RUNNER_TEMP/remote-xcodegen"
          test "$("$RUNNER_TEMP/remote-xcodegen/xcodegen/bin/xcodegen" --version)" = 'Version: 2.45.4'
          "$RUNNER_TEMP/remote-xcodegen/xcodegen/bin/xcodegen" generate
      - name: Compile unsigned native app for iPhone, simulator SDK and Mac
        working-directory: apple/QuenderinApp
        run: |
          xcodebuild build -project Quenderin.xcodeproj -scheme Quenderin -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/remote-apple-derived" CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project Quenderin.xcodeproj -scheme Quenderin -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/remote-apple-derived" CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project Quenderin.xcodeproj -scheme QuenderinMac -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/remote-apple-derived" CODE_SIGNING_ALLOWED=NO
      - name: Recheck the final SDK source receipt
        run: python3 -B native/remote-crypto/tools/native_sdk.py verify --platform apple --sdk apple/QuenderinKit/build/RemoteCryptoSDK

  android:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check pinned source and receipt failure tests
        run: |
          python3 -B native/remote-crypto/tools/verify_build_gate.py
          python3 -B -m unittest discover -s native/remote-crypto/tools -p 'test_*.py'
          python3 -B scripts/generate_inference_performance_identity.py --check
          python3 -B -m unittest scripts.tests.test_inference_performance_contract
          test -x "${JAVA_HOME_17_X64:?Included JDK 17 is required}/bin/java"
          printf 'JAVA_HOME=%s\nGRADLE_USER_HOME=%s\n' "$JAVA_HOME_17_X64" "$RUNNER_TEMP/remote-gradle" >> "$GITHUB_ENV"
      - name: Reuse the pinned existing Android SDK recipe
        timeout-minutes: 8
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;26.3.11579264'
          log-accepted-android-sdk-licenses: false
      - name: Select exact Rust compiler and Android arm64 target
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-linux-android
          printf 'ANDROID_NDK_HOME=%s/ndk/26.3.11579264\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Compile the portable MAX model-adapter boundary for Android arm64 (no vendor runtime)
        run: |
          cmake -S native/max-runtime/android-check -B "$RUNNER_TEMP/max-android-boundary" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/max-android-boundary" --parallel 2
      - name: Build actual generated Kotlin, arm64 API28 Noise and verified Android JNA AAR
        run: python3 -B native/remote-crypto/tools/native_sdk.py build --platform android --sdk "$RUNNER_TEMP/remote-android-sdk"
      - name: Compile native Android app and JVM core with the actual SDK
        working-directory: android
        run: timeout 900 ./gradlew :app:assembleDebug :quenderin-core:test --no-daemon --console=plain -Pquenderin.remoteCryptoDir="$RUNNER_TEMP/remote-android-sdk"
      - name: Verify packaged Noise/JNA bytes, supported ABI and every ELF/ZIP alignment
        run: python3 -B native/remote-crypto/tools/native_sdk.py verify-package --sdk "$RUNNER_TEMP/remote-android-sdk" --package android/app/build/outputs/apk/debug/app-debug.apk
