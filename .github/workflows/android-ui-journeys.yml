name: Android synthetic UI journeys

# One manual, standard public-repository runner. No model/native builds, provider calls,
# cache export or artifact storage. Selected synthetic PNGs are bounded in the job log.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-journeys
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  journeys:
    if: github.repository == 'alikatgh/quenderin' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up JDK 21 without cache export
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up only the compile SDK
        timeout-minutes: 6
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify bounded screenshot protocol fixtures
        run: python3 -B -m unittest scripts.tests.test_android_ui_screenshots
      - name: Compile synthetic app and test APKs, without native checkouts
        timeout-minutes: 18
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --console=plain --max-workers=2 \
            -Pquenderin.llamaDir="$RUNNER_TEMP/no-native-ui-source"
      - name: Enable KVM on this ephemeral hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-quenderin-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run one offline API 35 emulator and export selected PNGs to logs
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disk-size: 4G
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash scripts/run_android_ui_journeys.sh
