name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test scanner failure cases
        run: node --test scripts/tests/secret-scan.test.mjs
      - name: Scan tracked files for credentials
        run: node scripts/verify_no_secrets.mjs --all
