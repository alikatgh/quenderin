name: Android unsigned beta candidate

# Manual staging only. This workflow never signs, publishes, or uploads to Play.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed lowercase full 40-character commit reachable from main
        required: true
        type: string
      draft_release_id:
        description: Existing dedicated unpublished prerelease draft ID targeting that exact commit
        required: true
        type: string
      version_name:
        description: Expected Android versionName (major.minor.patch)
        required: true
        type: string
      version_code:
        description: Expected positive Android versionCode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-beta-candidate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  export:
    if: github.repository == 'alikatgh/quenderin' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # Only this manual job may upload to the precreated draft.
    env:
      CARGO_NET_RETRY: '0'
      CARGO_HTTP_TIMEOUT: '30'
      CARGO_BUILD_JOBS: '2'
      CANDIDATE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      CANDIDATE_RELEASE_ID: ${{ inputs.draft_release_id }}
      CANDIDATE_VERSION_NAME: ${{ inputs.version_name }}
      CANDIDATE_VERSION_CODE: ${{ inputs.version_code }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out reviewed export tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: export-tools
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unreviewed source, version or draft before candidate checkout
        working-directory: export-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/android_beta_candidate.py preflight
          python3 -m unittest discover -s scripts/tests -p test_android_beta_candidate.py
      - name: Check out the exact app candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Assert source and precreated draft before building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'GRADLE_USER_HOME=%s/quenderin-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 ../export-tools/scripts/android_beta_candidate.py preflight --source "$GITHUB_WORKSPACE/source"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch the pinned official manifest inspection tool (host only)
        timeout-minutes: 3
        run: python3 ../export-tools/scripts/android_beta_candidate.py fetch-bundletool --output "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
      - name: Set up Android SDK
        timeout-minutes: 10
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3; same pin and packages as CI
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Verify private backup and localization resource preservation
        run: |
          timeout 120 python3 -m unittest scripts.tests.test_android_private_backup
          timeout 120 python3 -B android/tools/test_gen_strings.py
      - name: Select exact Rust compiler and Android arm64 API28 toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-linux-android
          printf 'ANDROID_NDK_HOME=%s/ndk/26.3.11579264\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Build actual generated Kotlin, arm64 API28 Noise and verified Android JNA AAR
        run: timeout 900 python3 -B native/remote-crypto/tools/native_sdk.py build --platform android --sdk "$RUNNER_TEMP/remote-android-sdk"
      - name: Prepare verified Prism source (no model weights)
        run: timeout 600 python3 scripts/prepare_prism_runtime.py fetch --destination "$RUNNER_TEMP/prism-llama"
      - name: Build the isolated image runtime and JNI bridge
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264" timeout 900 bash scripts/build_android_diffusion.sh "$RUNNER_TEMP/android-diffusion"
      - name: Build the debug APK and unsigned release bundle with Prism, image and Noise/JNA runtimes
        working-directory: source/android
        run: timeout 1200 ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --console=plain -Pquenderin.runtime=prism -Pquenderin.llamaDir="$RUNNER_TEMP/prism-llama" -Pquenderin.diffusionLibDir="$RUNNER_TEMP/android-diffusion/jniLibs" -Pquenderin.remoteCryptoDir="$RUNNER_TEMP/remote-android-sdk"
      - name: Verify both packaged image DSO pairs, dependency closure and 16 KiB alignment
        run: |
          timeout 300 python3 scripts/verify_diffusion_android_package.py --libraries "$RUNNER_TEMP/android-diffusion/jniLibs" --package android/app/build/outputs/apk/debug/app-debug.apk
          timeout 300 python3 scripts/verify_diffusion_android_package.py --libraries "$RUNNER_TEMP/android-diffusion/jniLibs" --package android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify actual final APK and AAB Noise/JNA bytes, ABI and 16 KiB alignment
        run: |
          timeout 300 python3 -B native/remote-crypto/tools/native_sdk.py verify-package --sdk "$RUNNER_TEMP/remote-android-sdk" --package android/app/build/outputs/apk/debug/app-debug.apk
          timeout 300 python3 -B native/remote-crypto/tools/native_sdk.py verify-package --sdk "$RUNNER_TEMP/remote-android-sdk" --package android/app/build/outputs/bundle/release/app-release.aab
      - name: Run native runtime and memory guard unit tests
        working-directory: source/android
        run: timeout 300 ./gradlew :quenderin-core:test --no-daemon --console=plain
      - name: Export three verified assets to the validated existing draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 900 python3 ../export-tools/scripts/android_beta_candidate.py export \
            --source "$GITHUB_WORKSPACE/source" \
            --libraries "$RUNNER_TEMP/android-diffusion/jniLibs" \
            --prism "$RUNNER_TEMP/prism-llama" \
            --remote-sdk "$RUNNER_TEMP/remote-android-sdk" \
            --bundletool "$RUNNER_TEMP/bundletool-all-1.18.3.jar" \
            --output "$RUNNER_TEMP/android-beta-export"
